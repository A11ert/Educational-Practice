spring.application.name=Educational Practice

# PostgreSQL database. Username and password come from environment variables
# (DB_USERNAME / DB_PASSWORD) and fall back to the local development defaults.
spring.datasource.url=jdbc:postgresql://localhost:5432/EducationalPractice
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
