spring.application.name=Educational Practice

# Tests run against an in-memory H2 database so they need no external services
# and start from a clean schema every time.
spring.datasource.url=jdbc:h2:mem:marketplace;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
